<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Form pendaftaran sosialisasi pencegahan demam berdarah.">
        <title>Form Pendaftaran | Web Kesehatan</title>
        <link href="assets/css/form.css" rel="stylesheet">

    </head>

    <body>
        <div class="container">
            <div class="tag-atas">
                <h1>Form Pendaftaran</h1>
            </div>
            <div class="pendaftaran">
                <form id="registrationForm" novalidate>
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" class="input" autocomplete="name" required>
                    <div id="id_nama"></div>

                    <label for="identitas">No. Identitas</label>
                    <input type="text" id="identitas" class="input" inputmode="numeric" autocomplete="off" required>
                    <div id="id_identitas"></div>

                    <label for="notelp">No. Telepon</label>
                    <input type="tel" id="notelp" class="input" autocomplete="tel" required>
                    <div id="id_notelp"></div>

                    <label for="usia">Usia</label>
                    <input type="number" id="usia" class="input" min="1" max="120" required>
                    <div id="id_usia"></div>

                    <label for="kelamin">Jenis Kelamin</label>
                    <select id="kelamin" class="input" required>
                        <option value="">Pilih jenis kelamin</option>
                        <option value="Laki-Laki">Laki-Laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                    <div id="id_kelamin"></div>

                    <label for="tmptlahir">Tempat Lahir</label>
                    <input type="text" id="tmptlahir" class="input" required>
                    <div id="id_tmptlahir"></div>

                    <label for="tgllahir">Tanggal Lahir</label>
                    <input type="date" id="tgllahir" class="input" required>
                    <div id="id_tgllahir"></div> 

                    <label for="agama">Agama</label>
                    <select id="agama" class="input" required>
                        <option value="">Pilih agama</option>
                        <option value="Islam">Islam</option>
                        <option value="Kristen">Kristen</option>
                        <option value="Katolik">Katolik</option>
                        <option value="Hindu">Hindu</option>
                        <option value="Budha">Budha</option>
                        <option value="Khonghucu">Khonghucu</option>
                    </select>
                    <div id="id_agama"></div>

                    <label for="alamat">Alamat Rumah</label>
                    <input type="text" id="alamat" class="input" autocomplete="street-address" required>
                    <div id="id_alamat"></div>

                    <button type="submit">Daftar</button>
                    <div id="output" hidden></div>
                </form>
                
                    <div id="popup" role="dialog" aria-modal="true" aria-labelledby="popupTitle" hidden>
                        <div id="popup-content">
                            <h2 id="popupTitle">Data Pendaftaran</h2>
                            <div id="outputData"></div>
                            <button id="closePopup" type="button">Tutup</button>
                        </div>
                    </div>
            </div>
        </div>
        <script src="assets/js/form-validation.js"></script>
    </body>
</html>
